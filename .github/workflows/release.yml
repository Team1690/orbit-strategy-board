name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  release:
    # ubuntu-latest moves to 26.04 in november 2026 - its java 25 can't run this gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match v$version from package.json"
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::version $version must be major.minor.patch with minor and patch under 1000"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Java, Rust and the NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          rustup toolchain install
          rustup target add aarch64-linux-android
          # the tauri cli only reads NDK_HOME - set here because workflow-level env can't see ANDROID_HOME
          ndk_version=29.0.14206865
          ndk="$ANDROID_HOME/ndk/$ndk_version"
          if [[ ! -d "$ndk" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Write the signing config
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::the $name secret is missing or empty"
              exit 1
            fi
          done
          base64 --decode <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build the release APK
        env:
          TBA_API_KEY: ${{ secrets.TBA_API_KEY }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: bun tauri android build --apk --target aarch64 --ci

      - name: Verify the signature
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [[ -z "$ANDROID_CERT_SHA256" ]]; then
            echo "::error::the ANDROID_CERT_SHA256 repo variable is missing"
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          # build-tools 37 prints one "V2 Signer: ..." line per scheme where older ones print "Signer #1 ..." - match both and dedupe
          digest=$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$certs" | sort -u)
          if [[ "$digest" != "$ANDROID_CERT_SHA256" ]]; then
            echo "::error::the APK isn't signed by the pinned release key $ANDROID_CERT_SHA256 - see the apksigner output above"
            exit 1
          fi
          cp "$apk" "orbit-strategy-board-v$VERSION.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "orbit-strategy-board-v$VERSION.apk" --verify-tag --generate-notes

      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties
